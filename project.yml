name: OrigamiSayiKatlari
options:
  bundleIdPrefix: com.koc1985
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: tr
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "R6W7XU4TM7"
    CODE_SIGN_STYLE: Automatic
targets:
  OrigamiSayiKatlari:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "Origami Sayı Katları"
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koc1985.origamisayikatlari
        PRODUCT_NAME: "Origami Sayı Katları"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  OrigamiSayiKatlari:
    build:
      targets:
        OrigamiSayiKatlari: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
